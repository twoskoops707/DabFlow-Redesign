<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-c" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050010"/>
      <stop offset="100%" stop-color="#0A0018"/>
    </linearGradient>
    <linearGradient id="ring-c1" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FF0090"/>
      <stop offset="50%"  stop-color="#9B00FF"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>
    <linearGradient id="flame-c" x1="256" y1="320" x2="256" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FF4500"/>
      <stop offset="40%"  stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <filter id="glow-c" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="flame-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="amb-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B00FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9B00FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg-c)"/>

  <!-- Ambient glow -->
  <circle cx="256" cy="256" r="200" fill="url(#amb-c)"/>

  <!-- Scanline texture (subtle cyberpunk feel) -->
  <rect width="512" height="512" rx="108" fill="url(#scanlines)" opacity="0.04"/>

  <!-- Outer ring — cyan/purple gradient -->
  <circle cx="256" cy="256" r="168"
    fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="14" stroke-linecap="round"
    stroke-dasharray="791.7 263.9" transform="rotate(135 256 256)"/>
  <circle cx="256" cy="256" r="168"
    fill="none" stroke="url(#ring-c1)" stroke-width="14" stroke-linecap="round"
    stroke-dasharray="595 461" transform="rotate(135 256 256)"
    filter="url(#glow-c)"/>

  <!-- Inner accent ring -->
  <circle cx="256" cy="256" r="140"
    fill="none" stroke="rgba(0,255,255,0.06)" stroke-width="1"/>

  <!-- FLAME centered -->
  <g transform="translate(256,256)" filter="url(#flame-glow)">
    <!-- Outer flame -->
    <path d="
      M0 -90
      C 20 -70, 50 -40, 40 0
      C 35 28, 20 44, 0 50
      C -20 44, -35 28, -40 0
      C -50 -40, -20 -70, 0 -90 Z
    " fill="url(#flame-c)" opacity="0.9"/>

    <!-- Inner flame (lighter/white core) -->
    <path d="
      M0 -60
      C 12 -44, 28 -22, 22 6
      C 18 20, 10 30, 0 34
      C -10 30, -18 20, -22 6
      C -28 -22, -12 -44, 0 -60 Z
    " fill="rgba(255,240,200,0.85)"/>

    <!-- Flame highlight -->
    <path d="
      M0 -44
      C 6 -34, 12 -16, 8 4
      C 5 14, 0 20, 0 20
      C 0 20, -5 14, -8 4
      C -12 -16, -6 -34, 0 -44 Z
    " fill="rgba(255,255,255,0.5)"/>
  </g>

  <!-- Glitch accent lines (cyberpunk) -->
  <line x1="88"  y1="200" x2="128" y2="200" stroke="#00FFFF" stroke-width="2" opacity="0.4"/>
  <line x1="384" y1="200" x2="424" y2="200" stroke="#FF0090" stroke-width="2" opacity="0.4"/>
  <line x1="88"  y1="312" x2="128" y2="312" stroke="#FF0090" stroke-width="2" opacity="0.3"/>
  <line x1="384" y1="312" x2="424" y2="312" stroke="#00FFFF" stroke-width="2" opacity="0.3"/>

  <!-- Corner brackets -->
  <path d="M80 80 L80 56 L56 56" stroke="#00FFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M432 80 L432 56 L456 56" stroke="#FF0090" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M80 432 L80 456 L56 456" stroke="#FF0090" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M432 432 L432 456 L456 456" stroke="#00FFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- DF wordmark -->
  <text x="256" y="470" text-anchor="middle" font-family="monospace" font-size="36" font-weight="700" fill="url(#ring-c1)" opacity="0.5">DABFLOW</text>
</svg>
