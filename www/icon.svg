<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background rounded rect -->
    <clipPath id="bg-clip">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>

    <!-- Banger ring gradient: ember → amber -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E24D20"/>
      <stop offset="50%"  stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#E24D20"/>
    </linearGradient>

    <!-- Inner glow gradient -->
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F5A623" stop-opacity="0.25"/>
      <stop offset="60%"  stop-color="#E24D20" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E24D20" stop-opacity="0"/>
    </radialGradient>

    <!-- Heat shimmer radial -->
    <radialGradient id="heat-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#E24D20" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E24D20" stop-opacity="0"/>
    </radialGradient>

    <!-- Diamond gradient -->
    <linearGradient id="diamond-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#E24D20"/>
    </linearGradient>

    <!-- Outer ring drop shadow -->
    <filter id="ring-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#E24D20" flood-opacity="0.55"/>
    </filter>

    <!-- Glow filter for diamond -->
    <filter id="diamond-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F5A623" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="512" height="512" rx="112" ry="112" fill="#07090F"/>

  <!-- Subtle void texture vignette -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#heat-glow)"/>

  <!-- ── Outer decorative ring (faint) ── -->
  <circle
    cx="256" cy="256" r="220"
    fill="none"
    stroke="#1C2338"
    stroke-width="1.5"
  />

  <!-- ── Banger opening — main glowing ring ── -->
  <!-- Track (dark) -->
  <circle
    cx="256" cy="256" r="168"
    fill="none"
    stroke="#1C2338"
    stroke-width="28"
  />

  <!-- Progress arc — full circle, the "banger cross-section" -->
  <circle
    cx="256" cy="256" r="168"
    fill="none"
    stroke="url(#ring-grad)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-dasharray="1055.6"
    stroke-dashoffset="138"
    transform="rotate(-90 256 256)"
    filter="url(#ring-shadow)"
  />

  <!-- Ambient inner glow -->
  <circle cx="256" cy="256" r="148" fill="url(#glow-grad)"/>

  <!-- ── Tick marks on the ring ── -->
  <g stroke="#2A3450" stroke-width="2" opacity="0.7">
    <!-- 12 tick marks at 30° intervals -->
    <line x1="256" y1="74"  x2="256" y2="94"  transform="rotate(0   256 256)"/>
    <line x1="256" y1="74"  x2="256" y2="86"  transform="rotate(30  256 256)"/>
    <line x1="256" y1="74"  x2="256" y2="86"  transform="rotate(60  256 256)"/>
    <line x1="256" y1="74"  x2="256" y2="94"  transform="rotate(90  256 256)"/>
    <line x1="256" y1="74"  x2="256" y2="86"  transform="rotate(120 256 256)"/>
    <line x1="256" y1="74"  x2="256" y2="86"  transform="rotate(150 256 256)"/>
    <line x1="256" y1="74"  x2="256" y2="94"  transform="rotate(180 256 256)"/>
    <line x1="256" y1="74"  x2="256" y2="86"  transform="rotate(210 256 256)"/>
    <line x1="256" y1="74"  x2="256" y2="86"  transform="rotate(240 256 256)"/>
    <line x1="256" y1="74"  x2="256" y2="94"  transform="rotate(270 256 256)"/>
    <line x1="256" y1="74"  x2="256" y2="86"  transform="rotate(300 256 256)"/>
    <line x1="256" y1="74"  x2="256" y2="86"  transform="rotate(330 256 256)"/>
  </g>

  <!-- ── Center diamond — heat indicator ── -->
  <!-- Outer diamond (larger, slightly transparent) -->
  <polygon
    points="256,218 284,256 256,294 228,256"
    fill="url(#diamond-grad)"
    opacity="0.18"
  />
  <!-- Inner diamond (solid, glowing) -->
  <polygon
    points="256,232 272,256 256,280 240,256"
    fill="url(#diamond-grad)"
    filter="url(#diamond-glow)"
  />
  <!-- Diamond center dot -->
  <circle cx="256" cy="256" r="5" fill="#F5A623" opacity="0.9"/>

  <!-- ── "DF" lettermark inside ring (subtle) ── -->
  <text
    x="256" y="303"
    text-anchor="middle"
    font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"
    font-size="28"
    font-weight="900"
    letter-spacing="4"
    fill="#F1F5F9"
    opacity="0.18"
  >DABFLOW</text>

  <!-- ── Hot spot at top of ring ── -->
  <circle
    cx="256" cy="88"
    r="6"
    fill="#F5A623"
    opacity="0.9"
    filter="url(#diamond-glow)"
  />

  <!-- ── Outer border rim (subtle) ── -->
  <rect
    width="512" height="512" rx="112" ry="112"
    fill="none"
    stroke="#1C2338"
    stroke-width="2"
  />
</svg>
