name: Redesign - Build 3 APK Variants

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  setup:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: redesign-v${{ steps.version.outputs.VERSION }}-${{ github.run_number }}
          release_name: DabFlow Redesign v${{ steps.version.outputs.VERSION }} (build ${{ github.run_number }})
          body: |
            Redesign UI — 3 APK variants

            - **DabFlow-free.apk** — standard build, no demo data
            - **DabFlow-demo.apk** — 100 sessions pre-seeded
            - **DabFlow-premium.apk** — all features unlocked, 100 sessions pre-seeded

            **Timer fixes:** Quartz 18s/60s · Titanium 15s/70s · Ceramic 20s/75s
            **Home screen:** Butane/Propane heater source, correct concentrate list
            **Stats:** chart sizing fixed for mobile screens
          draft: false
          prerelease: false

  build-apk:
    name: Build ${{ matrix.variant }} APK
    needs: setup
    runs-on: ubuntu-latest

    strategy:
      matrix:
        variant: [free, demo, premium]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Inject BUILD_VARIANT into index.html
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          sed -i "s/window\.BUILD_VARIANT = '[^']*'/window.BUILD_VARIANT = '$VARIANT'/" www/index.html
          echo "Injected BUILD_VARIANT=$VARIANT"
          grep "BUILD_VARIANT" www/index.html

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.setup.outputs.upload_url }}
          asset_path: android/app/build/outputs/apk/debug/app-debug.apk
          asset_name: DabFlow-${{ matrix.variant }}.apk
          asset_content_type: application/vnd.android.package-archive
