name: Redesign - Build 3 APK Variants

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  setup:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: redesign-v${{ steps.version.outputs.VERSION }}-${{ github.run_number }}
          release_name: DabFlow Redesign v${{ steps.version.outputs.VERSION }} (build ${{ github.run_number }})
          body: |
            Redesign UI — 3 APK variants

            - **DabFlow-free.apk** — standard build, no demo data
            - **DabFlow-demo.apk** — 100 sessions pre-seeded
            - **DabFlow-premium.apk** — all features unlocked, 100 sessions pre-seeded

            **Timer fixes:** Quartz 18s/60s · Titanium 15s/70s · Ceramic 20s/75s
            **Home screen:** Butane/Propane heater source, correct concentrate list
            **Stats:** chart sizing fixed for mobile screens
          draft: false
          prerelease: false

  build-apk:
    name: Build ${{ matrix.variant }} APK
    needs: setup
    runs-on: ubuntu-latest

    strategy:
      matrix:
        variant: [free, demo, premium]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Inject BUILD_VARIANT into index.html
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          sed -i "s/window\.BUILD_VARIANT = '[^']*'/window.BUILD_VARIANT = '$VARIANT'/" www/index.html
          echo "Injected BUILD_VARIANT=$VARIANT"
          grep "BUILD_VARIANT" www/index.html

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Bump Android build to API 36 (Play Store 2026 requirement)
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/' android/variables.gradle
          sed -i "s|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:8.7.2|" android/build.gradle
          sed -i 's|gradle-[0-9.]*-all.zip|gradle-8.9-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          echo "=== variables.gradle ==="
          grep -E "compileSdk|targetSdk" android/variables.gradle
          echo "=== AGP ==="
          grep "com.android.tools.build:gradle" android/build.gradle
          echo "=== Gradle wrapper ==="
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Inject AdMob App ID into AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          APP_ID="ca-app-pub-6588738221262894~7650893291"
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i "s|</application>|    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APP_ID\"/>\n    </application>|" "$MANIFEST"
            echo "AdMob App ID injected"
          else
            echo "AdMob meta-data already present, skipping"
          fi
          grep -A1 "APPLICATION_ID" "$MANIFEST" || true

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Customize app name and icon per variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = "demo" ]; then
            APP_NAME="DabFlow Demo"; COLOR="#F59E0B"
          elif [ "$VARIANT" = "premium" ]; then
            APP_NAME="DabFlow Pro"; COLOR="#A78BFA"
          else
            APP_NAME="DabFlow"; COLOR="#2ECC8A"
          fi

          # Update launcher label in strings.xml
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${APP_NAME}</string>|" \
            android/app/src/main/res/values/strings.xml

          # Generate solid-color launcher icons (distinguishable at a glance)
          for cfg in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            DENSITY="${cfg%%:*}"; SIZE="${cfg##*:}"
            DIR="android/app/src/main/res/mipmap-${DENSITY}"
            mkdir -p "$DIR"
            convert -size "${SIZE}x${SIZE}" xc:"#080A0C" \
              -fill "$COLOR" \
              -draw "roundrectangle 4,4 $((SIZE-5)),$((SIZE-5)) $((SIZE/5)),$((SIZE/5))" \
              "$DIR/ic_launcher.png"
            cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
            # Overwrite adaptive icon layers if they exist
            [ -f "$DIR/ic_launcher_foreground.png" ] && \
              convert -size "${SIZE}x${SIZE}" xc:"$COLOR" "$DIR/ic_launcher_foreground.png"
          done
          echo "App name: $APP_NAME | Icon color: $COLOR"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK + AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleDebug

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.setup.outputs.upload_url }}
          asset_path: android/app/build/outputs/apk/debug/app-debug.apk
          asset_name: DabFlow-${{ matrix.variant }}.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload AAB to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.setup.outputs.upload_url }}
          asset_path: android/app/build/outputs/bundle/debug/app-debug.aab
          asset_name: DabFlow-${{ matrix.variant }}.aab
          asset_content_type: application/octet-stream
